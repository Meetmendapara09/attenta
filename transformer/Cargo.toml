[package]
name = "attenta"
version = "1.0.0"
edition = "2021"
description = "A from-scratch Rust implementation of 'Attention Is All You Need' (Vaswani et al., 2017), trained on Indian legal documents"

[dependencies]
ndarray = "0.15"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
